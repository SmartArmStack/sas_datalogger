services:
  sas_datalogger:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      TIMEOUT: 20
      PYTHONUNBUFFERED: 1
      DISPLAY: ":99"
    command: /bin/bash -c "
      cd /root/sas_datalogger_devel/src/sas_datalogger/docker
      && chmod +x test.sh
      && ./test.sh"
